<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berber Asistanı</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#10141c;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  background:#171e2a;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #303949;
}
header h1{margin:0;color:#d6b36a}
header p{color:#aab3c2;margin-bottom:0}
nav{
  display:flex;
  gap:8px;
  padding:12px;
  background:#171e2a;
}
nav button{flex:1}
main{padding:14px;max-width:700px;margin:auto}
.card{
  background:#1a2230;
  border:1px solid #303949;
  padding:16px;
  border-radius:14px;
  margin-bottom:14px;
}
h2{font-size:19px;margin-top:0;color:#e4c47e}
h3{margin-bottom:8px}
input,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border-radius:8px;
  border:1px solid #3a4557;
  background:#101722;
  color:white;
  font-size:16px;
}
button{
  padding:12px;
  border:0;
  border-radius:8px;
  background:#d6b36a;
  color:#171717;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5}
.full{width:100%}
.voice{
  width:100%;
  background:#7544bd;
  color:white;
  margin-bottom:12px;
}
.secondary{background:#344155;color:white}
.approve{background:#238b57;color:white}
.reject{background:#b63e48;color:white}
.done
