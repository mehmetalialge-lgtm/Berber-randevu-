<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berber Asistanı</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#10141c;color:white;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;background:#1b2330}
h1{color:#e4c47e;margin:0}
main{max-width:700px;margin:auto;padding:14px}
nav{display:flex;gap:8px;padding:12px;background:#1b2330}
button{padding:12px;border:0;border-radius:8px;background:#dfbd70;color:#171717;font-weight:bold;cursor:pointer}
nav button{flex:1}
.card{background:#1b2330;border:1px solid #354153;border-radius:12px;padding:16px;margin-bottom:14px}
h2{color:#e4c47e;font-size:20px}
input,select{width:100%;padding:12px;margin:7px 0 14px;background:#101722;color:white;border:1px solid #445064;border-radius:8px;font-size:16px}
.full{width:100%}
.voice{width:100%;background:#774bc0;color:white}
.green{background:#248451;color:white}
.red{background:#b63e48;color:white}
.blue{background:#287caa;color:white}
.gray{background:#39485d;color:white}
.hidden{display:none}
.notice{font-size:13px;color:#bbc5d4;line-height:1.5}
.item{background:#111923;padding:13px;border:1px solid #39475a;border-radius:10px;margin:12px 0}
.item p{overflow-wrap:anywhere}
.status{color:#e4c47e;font-weight:bold}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{flex:1;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;background:#111923;border-radius:8px}
.stat strong{display:block;color:#e4c47e;font-size:22px;margin-top:8px}
</style>
</head>

<body>

<header>
<h1>✂️ Berber Asistanı</h1>
<p>Randevu ve Kazanç Yönetimi</p>
</header>

<nav>
<button onclick="sayfa('berber')">✂️ Berber</button>
<button onclick="sayfa('musteri')">👤 Müşteri</button>
</nav>

<main>

<section id="berber">

<div class="card">
<h2>🎤 Sesle Randevu</h2>
<p class="notice">Örnek: Yarın saat 14.30'a Ahmet'i yaz, saç tıraşı, ben alacağım.</p>
<button class="voice full" id="sesButon" onclick="sesBaslat()">🎙️
