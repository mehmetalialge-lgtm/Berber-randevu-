
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7f5">
<title>Berber Asistanı</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f5;color:#26332b;font-family:Arial,sans-serif}
.app{max-width:480px;margin:auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin:10px 0 28px}
.logo{font-size:21px;font-weight:bold}
.logo span{color:#26985b}
.avatar{background:#e4f3e9;color:#26985b;border-radius:50%;padding:13px}
h2{font-size:23px;margin:0 0 7px}
.muted{color:#929b94;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.stat,.card{background:white;border-radius:16px;padding:17px;box-shadow:0 3px 14px #00000006}
.stat strong{display:block;font-size:23px;margin:12px 0 5px}
.green{color:#26985b}
.section{display:flex;justify-content:space-between;margin:25px 0 13px}
button{border:0;border-radius:11px;padding:13px;background:#26985b;color:white;font-weight:bold}
.full{width:100%}
input,select{width:100%;padding:14px;border:1px solid #e9ede9;border-radius:11px;background:#fafbfa;font-size:15px;margin:7px 0 14px}
.page{display:none}
.page.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 3px}
.nav button{background:white;color:#849087;font-size:11px;padding:5px}
.nav span{display:block;font-size:19px;margin-bottom:4px}
.nav button.active{color:#26985b}
.booking{background:white;border-radius:14px;padding:15px;margin:10px 0}
.booking p{font-size:12px;color:#89938c}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1;font-size:12px}
.light{background:#edf6f0;color:#26985b}
.red{background:#fff0ef;color:#c64b45}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">BERBER <span>ASİSTANI</span></div>
<div class="avatar">BA</div>
</header>

<section id="home" class="page active">
<h2>Hoş geldin 👋</h2>
<div class="muted">Bugünkü dükkan özeti</div>
<div class="stats">
<div class="stat">Bugünkü kazanç<strong class="green" id="kazanc">0 TL</strong></div>
<div class="stat">Randevular<strong id="sayac">0</strong></div>
<div class="stat">Bekleyen<strong id="bekleyen">0</strong></div>
<div class="stat">Müşteriler<strong id="musteri">0</strong></div>
</div>
<div class="section"><b>Son randevular</b></div>
<div id="son"></div>
<button class="full" onclick="git('ekle')">＋ Yeni randevu</button>
</section>

<section id="ekle" class="page">
<h2>Yeni randevu</h2>
<p class="muted">Müşteri bilgilerini gir</p>
<div class="card">
<label>Müşteri adı</label>
<input id="isim" placeholder="Ad soyad">
<label>Telefon</label>
<input id="telefon" placeholder="05xx xxx xx xx">
<label>Tarih</label>
<input id="tarih" type="date">
<label>Saat</label>
<input id="saat" type="time">
<label>Hizmet</label>
<select id="hizmet">
<option value="400">Saç kesimi - 400 TL</option>
<option value="200">Sakal - 200 TL</option>
<option value="600">Saç + sakal - 600 TL</option>
</select>
<label>Berber</label>
<select id="berber">
<option>Ben</option>
<option>Usta</option>
</select>
<button class="full" onclick="ekle()">Randevu talebi oluştur</button>
</div>
</section>

<section id="randevular" class="page">
<h2>Randevular</h2>
<div id="liste"></div>
</section>

<section id="kazancSayfa" class="page">
<h2>Kazanç takibi</h2>
<div class="card">
<div class="muted">Onaylı randevu toplamı</div>
<strong class="green" id="toplam">0 TL</strong>
</div>
</section>
</div>
<nav class="nav">
<button class="active" onclick="git('home',this)"><span>⌂</span>Ana sayfa</button>
<button onclick="git('randevular',this)"><span>▤</span>Randevular</button>
<button onclick="git('ekle',this)"><span>＋</span>Yeni ekle</button>
<button onclick="git('kazancSayfa',this)"><span>₺</span>Kazanç</button>
</nav>
