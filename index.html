<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berber Randevu</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10141c;
  color:white;
  font-family:Arial,sans-serif;
}

header{
  background:#171e2a;
  text-align:center;
  padding:22px 15px;
}

header h1{color:#48e0b0;margin:0}
header p{color:#b7c2d2}

main{max-width:650px;margin:auto;padding:15px}

nav{display:flex;gap:7px;margin-bottom:15px}
nav button{flex:1;padding:12px 5px}

.card{
  background:#1b2432;
  padding:17px;
  border-radius:14px;
  margin-bottom:15px;
}

h2{font-size:19px;margin-top:0}

label{
  display:block;
  margin-top:13px;
  color:#cbd5e1;
}

input,select,textarea,button{
  width:100%;
  padding:12px;
  margin-top:7px;
  border-radius:8px;
  font-size:16px;
}

input,select,textarea{
  background:#101722;
  color:white;
  border:1px solid #39475b;
}

button{
  background:#48e0b0;
  color:#10141c;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

.secondary{background:#344154;color:white}
.danger{background:#a83245;color:white}

.item{
  background:#101722;
  padding:13px;
  border-radius:9px;
  margin-top:10px;
}

.item p{margin:8px 0}
.small{font-size:13px;color:#aab7c8}
[hidden]{display:none!important}
</style>
</head>
